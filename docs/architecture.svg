<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a0aec0"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#fafafa"/>

  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a202c">Shellcode Validator — Architecture</text>
  <text x="700" y="64" text-anchor="middle" font-size="13" fill="#718096">Corpus in, verified pass/fail/inconclusive verdicts out</text>

  <!-- Corpus -->
  <rect x="600" y="90" width="200" height="50" rx="6" fill="#2d3748"/>
  <text x="700" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="white">Corpus</text>
  <text x="700" y="130" text-anchor="middle" font-size="11" fill="#cbd5e0">482 files, shell-storm mirror</text>

  <line x1="700" y1="140" x2="700" y2="170" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- manifest.py -->
  <rect x="580" y="172" width="240" height="56" rx="6" fill="#2b6cb0"/>
  <text x="700" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="white">scripts/manifest.py</text>
  <text x="700" y="212" text-anchor="middle" font-size="11" fill="#bee3f8">extracts bytes -&gt; manifest.json (401)</text>

  <line x1="700" y1="228" x2="700" y2="258" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- classify.py -->
  <rect x="580" y="260" width="240" height="50" rx="6" fill="#2b6cb0"/>
  <text x="700" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="white">scripts/classify.py</text>
  <text x="700" y="300" text-anchor="middle" font-size="11" fill="#bee3f8">buckets: hex / asm / ascii / other</text>

  <!-- Column headers (above the branch line, so arrows never cross them) -->
  <text x="175" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#22543d">LINUX (frozen scope)</text>
  <text x="580" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5282">WINDOWS (extended)</text>
  <text x="900" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#7b341e">FREEBSD (extended)</text>
  <text x="1225" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#718096">MACOS (investigated)</text>

  <!-- Split into 4 branches -->
  <line x1="700" y1="310" x2="700" y2="325" stroke="#4a5568" stroke-width="2"/>
  <line x1="175" y1="325" x2="1225" y2="325" stroke="#4a5568" stroke-width="2"/>
  <line x1="175" y1="325" x2="175" y2="358" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="325" x2="580" y2="358" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="325" x2="900" y2="358" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1225" y1="325" x2="1225" y2="358" stroke="#a0aec0" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>

  <!-- ===== LINUX COLUMN ===== -->
  <rect x="60" y="362" width="230" height="50" rx="6" fill="#276749"/>
  <text x="175" y="384" text-anchor="middle" font-size="13" font-weight="600" fill="white">scripts/corpus.py</text>
  <text x="175" y="402" text-anchor="middle" font-size="10" fill="#c6f6d5">curated N=60 selection</text>

  <line x1="175" y1="412" x2="175" y2="437" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="439" width="230" height="40" rx="6" fill="#2f855a"/>
  <text x="175" y="464" text-anchor="middle" font-size="12" fill="white">corpus.json (hand-verified categories)</text>

  <line x1="175" y1="479" x2="175" y2="504" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="506" width="230" height="56" rx="6" fill="#276749"/>
  <text x="175" y="528" text-anchor="middle" font-size="13" font-weight="600" fill="white">scripts/harness.py</text>
  <text x="175" y="546" text-anchor="middle" font-size="10" fill="#c6f6d5">Qiling, 10 category checkers</text>

  <line x1="175" y1="562" x2="175" y2="587" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="589" width="230" height="40" rx="6" fill="#22543d"/>
  <text x="175" y="614" text-anchor="middle" font-size="12" fill="white">CI: test-linux.yml</text>

  <line x1="175" y1="629" x2="175" y2="654" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="656" width="230" height="64" rx="6" fill="white" stroke="#276749" stroke-width="2"/>
  <text x="175" y="678" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">259 files, curated 60 verified</text>
  <text x="175" y="696" text-anchor="middle" font-size="11" fill="#22543d">116 pass / 70 fail / 73 inconclusive</text>
  <text x="175" y="712" text-anchor="middle" font-size="9" fill="#718096">(full in-scope set; see CI for curated-60 split)</text>

  <!-- ===== WINDOWS COLUMN ===== -->
  <rect x="465" y="362" width="230" height="56" rx="6" fill="#2c5282"/>
  <text x="580" y="384" text-anchor="middle" font-size="13" font-weight="600" fill="white">windows_harness.py</text>
  <text x="580" y="402" text-anchor="middle" font-size="10" fill="#bee3f8">Speakeasy emulation</text>

  <rect x="465" y="428" width="230" height="56" rx="6" fill="#2c5282"/>
  <text x="580" y="450" text-anchor="middle" font-size="13" font-weight="600" fill="white">windows_native/*.ps1</text>
  <text x="580" y="468" text-anchor="middle" font-size="10" fill="#bee3f8">real bytes + Procmon, windows-latest</text>

  <line x1="580" y1="418" x2="580" y2="428" stroke="#4a5568" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="580" y="424" text-anchor="middle" font-size="8" fill="#a0aec0">(no single tool covers Windows)</text>

  <line x1="580" y1="484" x2="580" y2="509" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="465" y="511" width="230" height="40" rx="6" fill="#2a4365"/>
  <text x="580" y="536" text-anchor="middle" font-size="11" fill="white">CI: test-windows-native(-batch).yml</text>

  <line x1="580" y1="551" x2="580" y2="576" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="465" y="578" width="230" height="80" rx="6" fill="white" stroke="#2c5282" stroke-width="2"/>
  <text x="580" y="600" text-anchor="middle" font-size="12" font-weight="700" fill="#2a4365">44/44 files run natively</text>
  <text x="580" y="618" text-anchor="middle" font-size="10" fill="#2a4365">most crash (XP-era hardcoded</text>
  <text x="580" y="633" text-anchor="middle" font-size="10" fill="#2a4365">addresses, confirmed via WerFault)</text>
  <text x="580" y="649" text-anchor="middle" font-size="10" fill="#2a4365">handful: real spawned shell / file write</text>

  <!-- ===== FREEBSD COLUMN ===== -->
  <rect x="785" y="362" width="230" height="66" rx="6" fill="#9c4221"/>
  <text x="900" y="384" text-anchor="middle" font-size="13" font-weight="600" fill="white">freebsd_harness.py</text>
  <text x="900" y="402" text-anchor="middle" font-size="10" fill="#feebc8">x86-64: Qiling 1.4.6 (pinned)</text>
  <text x="900" y="417" text-anchor="middle" font-size="10" fill="#feebc8">x86: raw Unicorn (Qiling has none)</text>

  <line x1="900" y1="428" x2="900" y2="453" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="785" y="455" width="230" height="40" rx="6" fill="#7b341e"/>
  <text x="900" y="480" text-anchor="middle" font-size="11" fill="white">CI: test-freebsd.yml</text>

  <line x1="900" y1="495" x2="900" y2="520" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="785" y="522" width="230" height="64" rx="6" fill="white" stroke="#9c4221" stroke-width="2"/>
  <text x="900" y="544" text-anchor="middle" font-size="12" font-weight="700" fill="#7b341e">27 files</text>
  <text x="900" y="562" text-anchor="middle" font-size="11" fill="#7b341e">20 pass / 1 fail / 6 inconclusive</text>
  <text x="900" y="578" text-anchor="middle" font-size="9" fill="#718096">(2 extraction failures, 4 gaps)</text>

  <!-- ===== MACOS COLUMN (dashed, investigated only) ===== -->
  <rect x="1105" y="362" width="240" height="80" rx="6" fill="none" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1225" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#718096">investigated, no harness</text>
  <text x="1225" y="402" text-anchor="middle" font-size="10" fill="#a0aec0">12/17 PowerPC: unsupported by anything</text>
  <text x="1225" y="417" text-anchor="middle" font-size="10" fill="#a0aec0">4 x86-64: 2 Qiling bugs patched,</text>
  <text x="1225" y="432" text-anchor="middle" font-size="10" fill="#a0aec0">syscall capture confirmed via raw Unicorn</text>

  <text x="1225" y="470" text-anchor="middle" font-size="10" fill="#a0aec0" font-style="italic">no CI, no CHECKERS —</text>
  <text x="1225" y="485" text-anchor="middle" font-size="10" fill="#a0aec0" font-style="italic">documented path, not a deliverable</text>

  <!-- Legend -->
  <rect x="60" y="750" width="20" height="14" fill="#276749"/>
  <text x="88" y="761" font-size="11" fill="#4a5568">Frozen scope (required)</text>

  <rect x="280" y="750" width="20" height="14" fill="#2c5282"/>
  <text x="308" y="761" font-size="11" fill="#4a5568">Extended coverage, working CI</text>

  <rect x="560" y="750" width="20" height="14" fill="none" stroke="#a0aec0" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="588" y="761" font-size="11" fill="#4a5568">Investigated, not a working pipeline</text>

  <text x="700" y="800" text-anchor="middle" font-size="10" fill="#a0aec0">Full methodology, known limitations and exact CI numbers: README.md + docs/schema.md + docs/scope.md</text>
</svg>
